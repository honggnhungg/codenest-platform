<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Quản Lý Khóa Học - CodeNest</title>
  <meta name="description" content="Khu vực quản lý nội dung các khóa học, bài học và xuất bản chương trình đào tạo trên CodeNest.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon"><i class="fa-solid fa-code"></i></div>
        <span>Code<span class="brand-highlight">Nest</span></span>
        <span class="badge badge-purple" style="font-size: 0.72rem; margin-left: 6px;">Admin Mode</span>
      </a>

      <div class="header-actions">
        <a href="/" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-up-right-from-square"></i> Xem Website</a>
        <a href="/login" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất</a>
      </div>
    </div>
  </header>

  <!-- Admin Layout -->
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin" class="admin-sidebar-link">
        <i class="fa-solid fa-gauge"></i> Dashboard
      </a>
      <a href="/admin/users" class="admin-sidebar-link">
        <i class="fa-solid fa-users"></i> Users
      </a>
      <a href="/admin/courses" class="admin-sidebar-link active">
        <i class="fa-solid fa-book"></i> Courses
      </a>
      <a href="/admin/courses" class="admin-sidebar-link">
        <i class="fa-solid fa-list-check"></i> Lessons
      </a>
      <a href="/admin/courses" class="admin-sidebar-link">
        <i class="fa-solid fa-tags"></i> Categories
      </a>
      <a href="/admin" class="admin-sidebar-link">
        <i class="fa-solid fa-chart-pie"></i> Analytics
      </a>
      <a href="/admin/settings" class="admin-sidebar-link">
        <i class="fa-solid fa-gear"></i> Settings
      </a>
    </aside>

    <main class="admin-content">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
        <div>
          <h1 style="font-size: 1.8rem; font-weight: 800;">Quản lý Khóa học (Course Management)</h1>
          <p style="color: var(--text-secondary); font-size: 0.92rem;">Tạo mới, chỉnh sửa nội dung bài giảng và thiết lập xuất bản.</p>
        </div>
        <button class="btn btn-primary btn-sm" onclick="showToast('Mở trình tạo khóa học mới...', 'success')">
          <i class="fa-solid fa-plus"></i> Tạo khóa học mới
        </button>
      </div>

      <!-- Search Toolbar -->
      <div style="background: #ffffff; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; background: var(--bg-surface-alt); border-radius: var(--radius-md); padding: 6px 14px; width: 100%; max-width: 360px;">
          <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted); margin-right: 8px;"></i>
          <input type="text" id="admin-course-search" placeholder="Tìm tên khóa học, danh mục..." style="border: none; background: transparent; outline: none; width: 100%; font-size: 0.9rem;">
        </div>

        <div style="display: flex; align-items: center; gap: 12px;">
          <span class="badge badge-all">6 Khóa đang xuất bản</span>
        </div>
      </div>

      <!-- Courses Table -->
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Khóa học</th>
              <th>Danh mục</th>
              <th>Cấp độ</th>
              <th>Học viên</th>
              <th>Trạng thái</th>
              <th>Cập nhật</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="admin-courses-tbody">
            <!-- Populated dynamically by admin.js -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/data.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
