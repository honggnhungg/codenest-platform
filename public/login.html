<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - CodeNest</title>
  <meta name="description" content="Đăng nhập vào tài khoản học viên tại CodeNest để tiếp tục quá trình học lập trình.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body style="background: radial-gradient(100% 100% at 50% 0%, #eff6ff 0%, #ffffff 100%);">
  <!-- Header -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon"><i class="fa-solid fa-code"></i></div>
        <span>Code<span class="brand-highlight">Nest</span></span>
      </a>

      <div style="font-size: 0.92rem; color: var(--text-secondary);">
        Chưa có tài khoản? <a href="/register" style="color: var(--primary); font-weight: 700;">Đăng ký ngay</a>
      </div>
    </div>
  </header>

  <!-- Login Card Form -->
  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 60px 20px;">
    <div style="width: 100%; max-width: 440px; background: #ffffff; border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 40px; box-shadow: var(--shadow-xl);">
      <div style="text-align: center; margin-bottom: 28px;">
        <h1 style="font-size: 1.7rem; font-weight: 800; margin-bottom: 6px;">Đăng nhập CodeNest</h1>
        <p style="color: var(--text-secondary); font-size: 0.92rem;">Nhập thông tin tài khoản của bạn để tiếp tục.</p>
      </div>

      <!-- Success Alert Box (After Registration) -->
      <div id="login-success-alert" style="display: none; background: var(--success-light); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 20px; font-size: 0.88rem; align-items: center; gap: 10px;">
        <i class="fa-solid fa-circle-check"></i>
        <span>Đăng ký thành công! Vui lòng nhập thông tin vừa tạo để đăng nhập.</span>
      </div>

      <!-- Error Alert Box -->
      <div id="login-error-alert" style="display: none; background: var(--danger-light); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 20px; font-size: 0.88rem; align-items: center; gap: 10px;">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="login-error-text"></span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email hoặc Tên đăng nhập</label>
          <input type="text" id="login-email" class="form-input" placeholder="student@codenest.dev" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Mật khẩu</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle" id="toggle-password" aria-label="Xem mật khẩu">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; font-size: 0.88rem;">
          <label style="display: flex; align-items: center; gap: 8px; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" id="login-remember" checked style="accent-color: var(--primary);"> Ghi nhớ đăng nhập
          </label>
          <a href="/forgot-password" style="color: var(--primary); font-weight: 600;">Quên mật khẩu?</a>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng nhập vào CodeNest
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-secondary);">
        Chưa có tài khoản? <a href="/register" style="color: var(--primary); font-weight: 700;">Đăng ký miễn phí</a>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Toggle Password Visibility
    document.getElementById('toggle-password').addEventListener('click', function() {
      const passInput = document.getElementById('login-password');
      const icon = this.querySelector('i');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        passInput.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    });

    // Real API Login Submission
    const loginForm = document.getElementById('login-form');
    const submitBtn = document.getElementById('login-submit-btn');
    const errorAlert = document.getElementById('login-error-alert');
    const errorText = document.getElementById('login-error-text');
    const successAlert = document.getElementById('login-success-alert');

    // Check if redirected from register
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'success') {
      if (successAlert) successAlert.style.display = 'flex';
      showToast('Đăng ký tài khoản thành công! Vui lòng đăng nhập.', 'success');
    }

    loginForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      errorAlert.style.display = 'none';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('login-remember').checked;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xác thực...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, remember })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          errorText.textContent = data.error || 'Đăng nhập không thành công. Vui lòng kiểm tra lại thông tin.';
          errorAlert.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng nhập vào CodeNest';
          return;
        }

        showToast(data.message || 'Đăng nhập thành công!', 'success');
        setTimeout(() => {
          window.location.href = data.redirectUrl || '/dashboard';
        }, 500);
      } catch (err) {
        errorText.textContent = 'Lỗi kết nối máy chủ. Vui lòng thử lại sau.';
        errorAlert.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng nhập vào CodeNest';
      }
    });
  </script>
</body>
</html>
