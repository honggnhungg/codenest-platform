<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Điều Khiển Học Viên - CodeNest</title>
  <meta name="description" content="Bảng điều khiển học tập cá nhân tại CodeNest. Quản lý tiến độ khóa học, lịch sử học tập và thống kê năng lực.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon"><i class="fa-solid fa-code"></i></div>
        <span>Code<span class="brand-highlight">Nest</span></span>
      </a>

      <nav class="main-nav" id="main-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/courses" class="nav-link">Courses</a>
        <a href="/my-learning" class="nav-link">Learning</a>
        <a href="/dashboard" class="nav-link active">Dashboard</a>
        <a href="/admin" class="nav-link" style="color: var(--primary);"><i class="fa-solid fa-shield-halved"></i> Admin</a>
      </nav>

      <div class="header-actions">
        <div class="notif-wrapper">
          <button class="notif-btn" id="notif-btn"><i class="fa-regular fa-bell"></i><span class="notif-badge" id="notif-badge"></span></button>
          <div class="notif-dropdown" id="notif-dropdown">
            <div class="notif-header">
              <span class="notif-title">Thông báo</span>
              <button class="notif-clear" id="notif-clear-btn">Đánh dấu đã đọc</button>
            </div>
            <ul class="notif-list" id="notif-list"></ul>
          </div>
        </div>

        <div class="user-menu-wrapper">
          <button class="user-avatar-btn" id="user-avatar-btn">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Avatar" class="user-avatar-img">
            <i class="fa-solid fa-chevron-down" style="font-size: 0.75rem; color: var(--text-muted);"></i>
          </button>
          <div class="user-menu-dropdown" id="user-menu-dropdown">
            <div class="user-menu-header">
              <div class="user-menu-name">Alex Morgan</div>
              <div class="user-menu-email">student@codenest.dev</div>
            </div>
            <a href="/dashboard" class="user-menu-item"><i class="fa-solid fa-gauge"></i> Dashboard</a>
            <a href="/my-learning" class="user-menu-item"><i class="fa-solid fa-book-open"></i> My Learning</a>
            <a href="/wishlist" class="user-menu-item"><i class="fa-regular fa-heart"></i> Wishlist</a>
            <a href="/profile" class="user-menu-item"><i class="fa-regular fa-user"></i> Profile</a>
            <a href="/settings" class="user-menu-item"><i class="fa-solid fa-gear"></i> Settings</a>
            <a href="/admin" class="user-menu-item"><i class="fa-solid fa-shield-halved"></i> Admin Console</a>
            <div class="user-menu-divider"></div>
            <a href="/login" class="user-menu-item" style="color: var(--danger);"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
          </div>
        </div>

        <button class="mobile-toggle" id="mobile-toggle"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <!-- Dashboard Main Content -->
  <main class="container dashboard-wrap" id="dashboard-root">
    <div style="padding: 100px 0; text-align: center;">
      <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
      <p style="margin-top: 14px; color: var(--text-muted);">Đang tải bảng điều khiển...</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom" style="border: none; padding: 0;">
      <div>&copy; 2026 CodeNest. All rights reserved.</div>
      <a href="/" style="color: var(--primary); font-weight: 600;">← Quay về trang chủ</a>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
