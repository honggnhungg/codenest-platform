<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên Mật Khẩu - CodeNest</title>
  <meta name="description" content="Khôi phục quyền truy cập vào tài khoản học viên tại CodeNest.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body style="background: radial-gradient(100% 100% at 50% 0%, #eff6ff 0%, #ffffff 100%);">
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon"><i class="fa-solid fa-code"></i></div>
        <span>Code<span class="brand-highlight">Nest</span></span>
      </a>

      <div style="font-size: 0.92rem; color: var(--text-secondary);">
        Nhớ mật khẩu? <a href="/login" style="color: var(--primary); font-weight: 700;">Đăng nhập</a>
      </div>
    </div>
  </header>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 60px 20px;">
    <div style="width: 100%; max-width: 440px; background: #ffffff; border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 40px; box-shadow: var(--shadow-xl);">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 16px;">
          <i class="fa-solid fa-key"></i>
        </div>
        <h1 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 8px;">Quên mật khẩu?</h1>
        <p style="color: var(--text-secondary); font-size: 0.92rem; line-height: 1.5;">
          Đừng lo lắng! Nhập địa chỉ email đăng ký tài khoản của bạn, chúng tôi sẽ gửi liên kết để đặt lại mật khẩu.
        </p>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="reset-email">Email đăng ký</label>
          <input type="email" id="reset-email" class="form-input" placeholder="student@codenest.dev" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
          Send Reset Link (Gửi liên kết khôi phục)
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-secondary);">
        <a href="/login" style="color: var(--text-muted);"><i class="fa-solid fa-arrow-left"></i> Quay lại trang Đăng nhập</a>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      showToast(`Đã gửi liên kết đặt lại mật khẩu tới: ${email}`, 'success');
      setTimeout(() => {
        window.location.href = '/login';
      }, 1600);
    });
  </script>
</body>
</html>
